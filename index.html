<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>Muskelgruppe</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0c0f;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.app{max-width:700px;margin:auto;padding:25px 16px 40px}h1{font-size:34px;margin:5px 0 22px}.sub,.muted{color:#9da2ad}.card{background:#191c22;border:1px solid #292d36;border-radius:20px;padding:7px;overflow:hidden}.row,.exercise{display:flex;align-items:center;width:100%;padding:18px 14px;border:0;border-bottom:1px solid #292d36;background:none;color:#fff;text-align:left}.row:last-child,.exercise:last-child{border:0}.row button{width:100%;border:0;background:none;color:#fff;text-align:left;font:inherit}.name{font-size:18px;font-weight:650}.chev{float:right;color:#777;font-size:24px}.section{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#9da2ad;margin:22px 4px 8px}.weight{margin-left:auto;color:#b9bec8;font-size:14px;text-align:right}.plus,.back{margin-top:12px;width:100%;padding:14px;border:0;border-radius:14px;background:#252a33;color:#fff;font-weight:700;font-size:16px}.back{width:auto;margin:0 0 10px}.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end}.sheet.open{display:flex}.panel{width:100%;max-width:700px;margin:auto;background:#181b21;border-radius:25px 25px 0 0;padding:20px 18px 30px}label{display:block;color:#a9aeb8;font-size:13px;margin:12px 0 6px}input,select{width:100%;padding:14px;border-radius:13px;border:1px solid #343945;background:#0f1115;color:#fff;font-size:17px}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1;padding:14px;border:0;border-radius:13px;font-weight:700}.save{background:#fff}.cancel{background:#292d36;color:#fff}.danger{background:#512128;color:#ffb7bf}.empty{text-align:center;padding:22px;color:#9da2ad}
</style></head><body><div class="app" id="app"></div>
<div class="sheet" id="sheet"><div class="panel"><h2 id="title">Übung</h2><label>Name</label><input id="name"><label>Wert</label><input id="weight" type="number" step=".5"><label>Art</label><select id="type"><option value="hand">kg/Hand</option><option value="bar">kg (Langhantel)</option><option value="body">Körpergewicht</option></select><p id="hint" class="muted"></p><div class="actions"><button class="cancel" onclick="closeSheet()">Abbrechen</button><button class="save" onclick="saveExercise()">Speichern</button></div><div class="actions"><button id="del" class="danger" onclick="deleteExercise()">Übung entfernen</button></div></div></div>
<div class="sheet" id="bodySheet"><div class="panel"><h2>Körpergewicht</h2><label>Gewicht</label><input id="body" type="number" step=".1"><div class="actions"><button class="cancel" onclick="closeBody()">Abbrechen</button><button class="save" onclick="saveBody()">Speichern</button></div></div></div>
<script>
const groups=["Brust","Schulter","Bizeps","Trizeps","Rücken"], defaults={"Brust":[["Bankdrücken",60,"bar"],["Enges Bankdrücken",50,"bar"],["Flies",15,"hand"]],"Schulter":[["Front-Flies",10,"hand"],["Flies",10,"hand"],["Reversed Flies",10,"hand"]],"Bizeps":[["Schrägbank-Curls",12,"hand"],["Curls",12,"hand"]],"Trizeps":[["Vorgebeugte Curls",15,"hand"],["Curls liegend",30,"bar"]],"Rücken":[["Klimmzüge",0,"body"],["Rudern breit",40,"bar"],["Rudern eng",40,"bar"]]};
let data=JSON.parse(localStorage.getItem("mgdata")||"null"),bw=+(localStorage.getItem("mgbw")||70),group=null,index=null;
if(!data){data={};groups.forEach(g=>data[g]=defaults[g].map(x=>({name:x[0],weight:x[1],type:x[2]})));save()}
function save(){localStorage.setItem("mgdata",JSON.stringify(data))}
function fmt(x){return (+x).toLocaleString("de-DE",{maximumFractionDigits:1})}
function wt(x){return x.type=="body"?fmt(bw)+" kg (Körpergewicht)":fmt(x.weight)+" "+(x.type=="hand"?"kg/Hand":"kg (Langhantel)")}
function home(){group=null;app.innerHTML=`<h1>Muskelgruppe</h1><p class="sub">Wähle eine Muskelgruppe</p><div class="card">${groups.map(g=>`<div class="row"><button onclick="openGroup('${g}')"><span class="name">${g}</span><span class="chev">›</span></button></div>`).join("")}</div><div class="section">Einstellungen</div><div class="card"><div class="row"><button onclick="openBody()"><span class="name">Körpergewicht</span><span class="chev">${fmt(bw)} kg ›</span></button></div></div>`}
function openGroup(g){group=g;app.innerHTML=`<button class="back" onclick="home()">‹ Muskelgruppen</button><h1>${g}</h1><div class="section">Übungen</div><div class="card">${data[g].length?data[g].map((x,i)=>`<button class="exercise" onclick="edit(${i})"><span class="name">${x.name}</span><span class="weight">${wt(x)}</span></button>`).join(""):`<div class="empty">Noch keine Übungen</div>`}</div><button class="plus" onclick="add()">＋ Übung hinzufügen</button>`}
function edit(i){index=i;let x=data[group][i];openEditor("Übung bearbeiten",x,true)}
function add(){index=null;openEditor("Neue Übung",{name:"Neue Übung",weight:0,type:"hand"},false)}
function openEditor(t,x,del){title.textContent=t;name.value=x.name;weight.value=x.weight;type.value=x.type;document.getElementById("del").style.display=del?"block":"none";hint.textContent=type.value=="body"?"Aktuell: "+fmt(bw)+" kg":"";sheet.classList.add("open")}
type.onchange=()=>hint.textContent=type.value=="body"?"Aktuell: "+fmt(bw)+" kg":"";
function closeSheet(){sheet.classList.remove("open")}
function saveExercise(){let x={name:name.value.trim()||"Neue Übung",weight:+weight.value||0,type:type.value};if(index===null)data[group].push(x);else data[group][index]=x;save();closeSheet();openGroup(group)}
function deleteExercise(){if(index!==null){data[group].splice(index,1);save();closeSheet();openGroup(group)}}
function openBody(){body.value=bw;bodySheet.classList.add("open")}function closeBody(){bodySheet.classList.remove("open")}function saveBody(){bw=+body.value||0;localStorage.setItem("mgbw",bw);closeBody();group?openGroup(group):home()}
home();
</script></body></html>
